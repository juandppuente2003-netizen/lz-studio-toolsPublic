<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LZ-PLUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root{--bg:#06080F;--rail:#0A0E18;--card:#121828;--card2:#1A2238;--line:#1E2740;--tx:#F3F5FA;--mut:#9AA4BA;--accent:#F5B84B;--ok:#6EE7A0;--bad:#FF8A7A}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{font-size:clamp(12px,.95vw,26px)}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
  a{color:var(--accent)}
  .disp{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.01em}
  #app{display:flex;height:100vh}

  /* ---------- Menú lateral ---------- */
  #rail{width:6rem;flex-shrink:0;background:linear-gradient(180deg,#0B1122,#070A12);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.8rem .9rem;gap:.35rem;transition:width .18s ease;z-index:5;overflow:hidden}
  #rail:focus-within,body:not(.kbd) #rail:hover{width:17rem}
  .brand{display:flex;align-items:center;gap:.9rem;height:3.4rem;padding-left:.35rem;margin-bottom:1.6rem;white-space:nowrap;font-size:1.9rem}
  .logo{width:3.2rem;height:3.2rem;flex-shrink:0;border-radius:.9rem;background:var(--accent);color:#0A0E18;display:grid;place-items:center;font-size:1.5rem}
  .brand b{color:var(--accent)}
  .nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:1.1rem;height:3.4rem;padding:0 1.05rem;border-radius:.9rem;color:var(--mut);font-weight:700;font-size:1.15rem;white-space:nowrap}
  .nav svg{width:1.7rem;height:1.7rem;flex-shrink:0}
  .nav span,.brand span{opacity:0;transition:opacity .15s}
  #rail:focus-within .nav span,body:not(.kbd) #rail:hover .nav span,#rail:focus-within .brand span,body:not(.kbd) #rail:hover .brand span{opacity:1}
  .nav.on{color:#fff;background:rgba(255,255,255,.06)}.nav.on svg{color:var(--accent)}
  .nav:focus{background:var(--accent);color:#111}.nav:focus svg{color:#111}
  .rail-sp{flex:1}

  main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;position:relative}
  main::-webkit-scrollbar{width:0}
  .view{display:none;padding-bottom:4rem}.view.on{display:block}
  .clock{position:fixed;top:1.5rem;right:2.4rem;z-index:6;font-weight:800;font-size:1.35rem;text-shadow:0 2px 10px #000;pointer-events:none}
  .head{padding:2.6rem 3rem 1.2rem;display:flex;align-items:flex-end;gap:1.6rem;flex-wrap:wrap}
  .head h1{margin:0;font-size:3.6rem;line-height:1}
  .head p{margin:0;color:var(--mut);font-size:1.05rem}
  .note{color:var(--mut);font-size:1rem;line-height:1.5;margin:0}

  /* ---------- Portada (se actualiza con lo que tengas seleccionado) ---------- */
  .spot{position:relative;height:64vh;min-height:24rem;display:flex;align-items:flex-end;overflow:hidden}
  .spot .bg{position:absolute;inset:0;background:#0B0F1A center 20%/cover no-repeat;transition:opacity .4s}
  .spot .bg.fade{opacity:0}
  .spot::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(6,8,15,.88) 28%,rgba(6,8,15,.25) 62%,rgba(6,8,15,.05)),linear-gradient(0deg,var(--bg) 1%,transparent 42%);pointer-events:none}
  .spot .in{position:relative;z-index:1;padding:0 3rem 7.5rem;max-width:46rem;display:flex;flex-direction:column;gap:.9rem}
  .kick{color:var(--accent);font-weight:800;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:.8rem;flex-wrap:wrap}
  .spot h1{margin:0;font-size:4.4rem;line-height:.92}
  .spot p{margin:0;color:#D5DBE7;font-size:1.2rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .btns{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.4rem}
  .rows{position:relative;z-index:1;margin-top:-5.5rem;display:flex;flex-direction:column;gap:1.8rem}
  .rows.flat{margin-top:0}
  /* Portada fija arriba y filas que se desplazan debajo (estilo TV) */
  .view.cat.on{display:flex;flex-direction:column;height:100vh;padding-bottom:0}
  .view.cat .spot{height:56vh;min-height:20rem;flex-shrink:0}
  .view.cat .rows{flex:1;min-height:0;overflow-y:auto;margin-top:-6.5rem;padding-bottom:4rem;scroll-padding-top:1rem}
  .view.cat .rows::-webkit-scrollbar{width:0}
  .row h3{margin:0 0 .2rem 3rem;font-size:1.7rem;display:flex;gap:1rem;align-items:baseline}
  .row h3 small{font-family:Manrope,sans-serif;font-size:.95rem;color:var(--mut);font-weight:600;letter-spacing:0}
  .strip{display:flex;gap:1.1rem;overflow-x:auto;padding:1rem 3rem 1.3rem;scroll-padding:0 3rem}
  .strip::-webkit-scrollbar{display:none}
  .row .empty{margin:0 3rem;color:var(--mut)}

  /* ---------- Tarjetas ---------- */
  .card{all:unset;cursor:pointer;flex-shrink:0;width:11.5rem;display:flex;flex-direction:column;gap:.6rem;outline:none}
  .card .pi{width:100%;aspect-ratio:2/3;border-radius:.8rem;overflow:hidden;background:var(--card);position:relative;transition:transform .18s ease,box-shadow .18s ease}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card .ct{font-size:1rem;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .1rem}
  .card .sub{font-size:.85rem;color:#6D7894;margin-top:-.4rem;padding:0 .1rem}
  .card:focus .pi,body:not(.kbd) .card:hover .pi{transform:scale(1.08);box-shadow:0 0 0 .22rem var(--accent),0 1rem 2.4rem rgba(0,0,0,.65)}
  .card:focus .ct{color:#fff}
  .card .ok-b{position:absolute;left:.5rem;bottom:.5rem;background:rgba(10,40,24,.88);color:var(--ok);font-weight:800;font-size:.75rem;padding:.2rem .5rem;border-radius:.4rem}
  .card .badge-r{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.75);color:var(--accent);font-weight:800;font-size:.8rem;padding:.2rem .5rem;border-radius:.4rem}
  .card.wide{width:17rem}.card.wide .pi{aspect-ratio:16/9}
  .card.ch{width:14rem}.card.ch .pi{aspect-ratio:16/9;background:linear-gradient(160deg,#182036,#0D1220);display:grid;place-items:center}
  .card.ch .pi img{width:70%;height:70%;object-fit:contain}
  .card.ch .live{position:absolute;top:.5rem;left:.5rem;background:#E5484D;color:#fff;font-weight:800;font-size:.7rem;padding:.15rem .45rem;border-radius:.3rem;letter-spacing:.05em}
  .ph{position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;font-weight:800;font-size:1.1rem;color:var(--mut);background:linear-gradient(160deg,#1A2236,#0E1322)}
  .sk .pi{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:1.6rem 1.1rem;padding:1rem 3rem}
  .grid .card{width:auto}

  /* ---------- Botones y campos ---------- */
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;height:3.3rem;padding:0 1.7rem;border-radius:.8rem;font-weight:800;font-size:1.15rem;background:rgba(255,255,255,.13);color:#fff;transition:transform .12s ease;white-space:nowrap}
  .btn svg{width:1.3rem;height:1.3rem}
  .btn.pri{background:#fff;color:#0A0E18}
  .btn.sm{height:2.7rem;padding:0 1.1rem;font-size:1rem}
  .btn.danger{color:var(--bad)}
  .btn:focus,body:not(.kbd) .btn:hover{background:var(--accent);color:#111;transform:scale(1.05)}
  .chips{display:flex;gap:.6rem;flex-wrap:wrap}
  .chip{all:unset;cursor:pointer;height:2.7rem;padding:0 1.2rem;border-radius:1.35rem;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:1.02rem;display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap}
  .chip.on{background:#fff;color:#111;border-color:#fff}
  .chip:focus,body:not(.kbd) .chip:hover{background:var(--accent);color:#111;border-color:var(--accent);transform:scale(1.05)}
  input{height:3.3rem;width:100%;min-width:0;font:inherit;font-size:1.15rem;border-radius:.8rem;border:2px solid var(--line);background:var(--card);color:var(--tx);padding:0 1.1rem}
  input:focus{border-color:var(--accent);outline:0}
  label.f{display:flex;flex-direction:column;gap:.45rem;font-size:.85rem;color:var(--mut);font-weight:800;letter-spacing:.06em;text-transform:uppercase}

  /* ---------- En vivo ---------- */
  .srcs{display:flex;gap:.6rem;overflow-x:auto;padding:.3rem 0}
  .srcs::-webkit-scrollbar{display:none}
  .live{display:grid;grid-template-columns:15rem minmax(0,1fr) minmax(0,1.3fr);gap:1.4rem;padding:0 3rem;height:calc(100vh - 10.5rem)}
  .col{min-height:0;display:flex;flex-direction:column;gap:.35rem;overflow-y:auto;padding:.2rem}
  .col::-webkit-scrollbar{width:0}
  .gbtn{all:unset;cursor:pointer;padding:.85rem 1rem;border-radius:.7rem;font-weight:700;font-size:1.05rem;color:var(--mut);display:flex;justify-content:space-between;gap:.5rem;flex-shrink:0}
  .gbtn small{opacity:.7}
  .gbtn.on{color:#fff;background:var(--card)}
  .gbtn:focus,body:not(.kbd) .gbtn:hover{background:var(--accent);color:#111}
  .chrow{all:unset;cursor:pointer;display:flex;align-items:center;gap:1rem;padding:.55rem .9rem;border-radius:.8rem;min-height:3.6rem;flex-shrink:0}
  .chrow .no{width:2.4rem;text-align:right;color:var(--mut);font-weight:800;flex-shrink:0}
  .lg{width:4.8rem;height:2.7rem;border-radius:.45rem;background:#0E1424;display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:.8rem;font-weight:800;color:var(--mut)}
  .lg img{max-width:88%;max-height:88%;object-fit:contain}
  .chrow .tx{min-width:0;flex:1}
  .chrow b{display:block;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chrow small{color:var(--mut);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .chrow .st{color:var(--accent);font-size:1.1rem}
  .chrow.on{background:var(--card2);box-shadow:inset 0 0 0 2px rgba(245,184,75,.55)}
  .chrow:focus,body:not(.kbd) .chrow:hover{background:#fff;color:#111}
  .chrow:focus small,.chrow:focus .no,body:not(.kbd) .chrow:hover small,body:not(.kbd) .chrow:hover .no{color:#444}
  .prev{gap:1.1rem;overflow:visible}
  .slot{position:relative;aspect-ratio:16/9;border-radius:1rem;overflow:hidden;background:#000;flex-shrink:0}
  .pinfo{display:flex;flex-direction:column;gap:.6rem}
  .pinfo h2{margin:0;font-size:2.4rem;line-height:1}
  .pinfo .note b{color:var(--tx)}
  .more{all:unset;cursor:pointer;text-align:center;padding:.9rem;color:var(--accent);font-weight:800;border-radius:.7rem;flex-shrink:0}
  .more:focus{background:var(--accent);color:#111}

  /* ---------- Reproductor ---------- */
  #pv{position:absolute;inset:0;background:#000;outline:none}
  #pv.full{position:fixed;inset:0;z-index:50}
  #pv video{width:100%;height:100%;display:block;background:#000}
  #yt,#yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pv-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;color:#D3DAE7;font-size:1.25rem;background:rgba(0,0,0,.5)}
  .pv-msg .btns{justify-content:center}
  .spin{width:3rem;height:3rem;border-radius:50%;border:.3rem solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 1rem}
  @keyframes sp{to{transform:rotate(360deg)}}
  .osd{position:absolute;left:0;right:0;bottom:0;padding:2.4rem 3.4rem;background:linear-gradient(transparent,rgba(0,0,0,.92));display:flex;gap:1.6rem;align-items:center;opacity:0;transition:opacity .3s;pointer-events:none}
  .osd.show{opacity:1}
  .osd .lg{width:8rem;height:4.5rem;background:rgba(255,255,255,.08)}
  .osd .num{color:var(--accent);font-weight:900;font-size:1.4rem}
  .osd h2{margin:0;font-size:3rem;line-height:1}
  .osd p{margin:.3rem 0 0;color:#CFD6E4;font-size:1.15rem}
  .hint{position:absolute;top:1.6rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:.6rem 1.2rem;border-radius:2rem;font-weight:700;color:#DDE3EE;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .hint.show{opacity:1}
  .pv-top{position:absolute;top:1.4rem;right:1.4rem;display:flex;gap:.6rem;opacity:0;transition:opacity .2s}
  body:not(.kbd) #pv.full:hover .pv-top,#pv.full .pv-top:focus-within{opacity:1}
  #pv:not(.full) .osd,#pv:not(.full) .pv-top,#pv:not(.full) .hint,#pv:not(.full) .panel{display:none}
  .panel{position:absolute;top:0;bottom:0;left:0;width:34rem;max-width:90vw;background:rgba(7,10,18,.95);padding:2rem 1.2rem 1.2rem;display:flex;flex-direction:column;gap:1rem}
  .panel h3{margin:0 .6rem;font-size:2rem}
  .plist{overflow-y:auto;display:flex;flex-direction:column;gap:.3rem;padding:.2rem}
  .plist::-webkit-scrollbar{width:0}

  /* ---------- Ficha ---------- */
  .layer{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden}
  .layer::-webkit-scrollbar{width:0}
  .det-bg{position:absolute;top:0;left:0;right:0;height:88vh;background:#0B0F1A center 20%/cover no-repeat}
  .det-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(6,8,15,.9) 32%,rgba(6,8,15,.3) 70%,rgba(6,8,15,.15)),linear-gradient(0deg,var(--bg) 0%,transparent 50%)}
  .det-in{position:relative;padding:16vh 4rem 2rem;max-width:58rem;display:flex;flex-direction:column;gap:1.1rem}
  .det-in h1{margin:0;font-size:4.8rem;line-height:.92}
  .det-logo{max-width:28rem;max-height:9rem;object-fit:contain;object-position:left}
  .meta{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;font-size:1.1rem;color:#CFD6E4;font-weight:600}
  .meta .r{color:var(--accent);font-weight:800}
  .tag{padding:.25rem .7rem;border-radius:.4rem;background:rgba(255,255,255,.1);font-size:.95rem}
  .det-in p{margin:0;font-size:1.25rem;line-height:1.55;color:#DCE2EC}
  .det-in .cast{font-size:1.05rem;color:var(--mut)}
  .det-rows{position:relative;display:flex;flex-direction:column;gap:1.6rem;padding-bottom:3rem}
  .ep .pi{aspect-ratio:16/9}
  .ep{width:18rem}
  .ep .ct{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  /* ---------- Ventanas ---------- */
  #pick{position:fixed;inset:0;z-index:60;background:rgba(2,4,9,.78);display:grid;place-items:center;padding:2rem}
  .sheet{background:#0E1322;border:1px solid var(--line);border-radius:1.3rem;padding:2.2rem;width:min(50rem,94vw);max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:1.2rem}
  .sheet::-webkit-scrollbar{width:0}
  .sheet h2{margin:0;font-size:2.6rem}
  .opt{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.2rem;border-radius:.8rem;background:var(--card);font-weight:700;font-size:1.1rem}
  .opt small{display:block;color:var(--mut);font-weight:600;font-size:.9rem;margin-top:.2rem}
  .opt:focus,body:not(.kbd) .opt:hover{background:var(--accent);color:#111}.opt:focus small{color:#333}
  .pin-dots{display:flex;gap:1rem;justify-content:center;font-size:2.4rem;letter-spacing:.3rem;min-height:3rem}
  .pad{display:grid;grid-template-columns:repeat(3,5.5rem);gap:.8rem;justify-content:center}
  .key{all:unset;cursor:pointer;height:4rem;border-radius:.8rem;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.4rem}
  .key:focus,body:not(.kbd) .key:hover{background:var(--accent);color:#111}
  .kb{display:grid;grid-template-columns:repeat(10,minmax(0,3.6rem));gap:.45rem}
  .kb .key{height:3.3rem;font-size:1.15rem}
  .kb .key.w2{grid-column:span 2}.kb .key.w3{grid-column:span 3}

  /* ---------- Buscar ---------- */
  .search{display:flex;gap:2.4rem;padding:0 3rem;flex-wrap:wrap;align-items:flex-start}
  .search .left{display:flex;flex-direction:column;gap:1rem}
  .qbox{font-size:2rem;font-weight:800;min-height:3.6rem;border-bottom:3px solid var(--accent);padding:.3rem .2rem;max-width:37rem;display:flex;align-items:center;gap:.6rem}
  .qbox .ph2{color:#4D5874}
  .caret{width:.15rem;height:2rem;background:var(--accent);animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .search .right{flex:1 1 30rem;min-width:0;display:flex;flex-direction:column;gap:1rem}

  /* ---------- Servidores y ajustes ---------- */
  .wrap{padding:0 3rem;display:flex;flex-direction:column;gap:1.6rem;max-width:90rem}
  .box{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.6rem;display:flex;flex-direction:column;gap:1rem}
  .box h2{margin:0;font-size:2rem}
  .scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(24rem,1fr));gap:1rem}
  .scard{background:#0E1322;border:1px solid var(--line);border-radius:1rem;padding:1.2rem;display:flex;flex-direction:column;gap:.7rem}
  .scard h4{margin:0;font-size:1.3rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
  .pill{font-size:.75rem;font-weight:800;letter-spacing:.06em;padding:.25rem .6rem;border-radius:.4rem;background:rgba(255,255,255,.08);color:var(--mut);text-transform:uppercase}
  .pill.ok{background:rgba(110,231,160,.14);color:var(--ok)}.pill.warn{background:rgba(245,184,75,.15);color:var(--accent)}.pill.bad{background:rgba(255,138,122,.14);color:var(--bad)}
  .form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem;align-items:end}
  .lock{display:flex;flex-direction:column;align-items:center;gap:1.2rem;padding:5rem 2rem;text-align:center}
  .lock svg{width:4rem;height:4rem;color:var(--accent)}

  #toast{position:fixed;left:50%;bottom:2.4rem;transform:translate(-50%,1rem);background:#fff;color:#111;font-weight:700;font-size:1.1rem;padding:1rem 1.6rem;border-radius:.9rem;max-width:min(46rem,90vw);text-align:center;opacity:0;transition:all .25s;z-index:70;pointer-events:none;box-shadow:0 1rem 2rem rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:900px){
    html{font-size:13px}
    .live{grid-template-columns:1fr;height:auto}
    .prev{order:-1}
    .col{max-height:50vh}
    .spot h1{font-size:3rem}.det-in h1{font-size:3.2rem}
  }
</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Menú principal">
    <div class="brand disp"><span class="logo">LZ</span><span>LZ<b>-PLUS</b></span></div>
    <button class="nav" data-view="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Buscar</span></button>
    <button class="nav on" data-view="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
    <button class="nav" data-view="vivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M8 2l4 4 4-4"/></svg><span>En vivo</span></button>
    <button class="nav" data-view="peliculas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg><span>Películas</span></button>
    <button class="nav" data-view="series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Series</span></button>

async function runSearch() {

    if (want('anime')) add('Anime', kitsuList('kitsu-anime-list/search=' + g(q)), mk);
  }

    const k = mapType(c.type);
    if (!want(k)) continue;
    add((c.name || 'Resultados') + ' · ' + (a.manifest.name || a.name), addonList(a, c, 'search=' + g(q)), mk);
  }
  if (want('ch')) {
    const p = (async () => {
      const srcs = ['iptv', S.src].filter((x, i, a) => a.indexOf(x) === i);

    })();
    add('Canales', p, (c, i, l) => chCard(c, l, i), false);
  }
  await Promise.allSettled(sections);
  if (my === runSearch.n && !box.children.length) box.append(el('p', 'note', 'Sin resultados para “' + q + '”.'));
}

  const cards = el('div', 'scards');
  if (!S.servers.length) cards.append(el('p', 'note', 'Todavía no hay servidores.'));
  S.servers.forEach((s) => {
    const c = el('div', 'scard');
    const t = el('h4'); t.append(el('span', null, s.name), el('span', 'pill', KIND[s.kind]));
    const st = el('p', 'note', 'Sin probar');
    if (s.kind === 'addon' && s.manifest) {
      const r = resNames(s); st.textContent = [r.includes('stream') && 'Videos', r.includes('subtitles') && 'Subtítulos', r.includes('catalog') && (s.manifest.catalogs?.length || '') + ' catálogos'].filter(Boolean).join(' · ') || 'Complemento';
      if (s.manifest.configurationRequired && /^\/manifest\.json/i.test(new URL(s.url).pathname)) t.append(el('span', 'pill warn', 'Falta configurar'));
    }
    const b = el('div', 'btns');
    b.append(btn('btn sm', 'Probar', () => testServer(s, st, t)), btn('btn sm', 'Renombrar', () => renameServer(s)));
    if (s.kind === 'addon' && s.manifest?.configurable) b.append(btn('btn sm', 'Configurar', () => configureAddon(s)));
    b.append(btn('btn sm danger', 'Eliminar', () => confirmBox('¿Eliminar “' + s.name + '”?', 'Se quitará de la app.', 'Eliminar', () => { S.servers = S.servers.filter((x) => x.id !== s.id); if (s.kind === 'addon') { AV = {}; saveAV(); ['inicio', 'peliculas', 'series', 'anime', 'buscar'].forEach((k) => built[k] = false); } if (S.src === s.id) S.src = 'iptv'; srcCache.delete(s.id); save(); built.vivo = false; buildServers(); toast('Servidor eliminado'); })));
    c.append(t, st, b); cards.append(c);
  });
  list.append(cards); w.append(list);
  // Agregar
  const add = el('div', 'box'); add.append(el('h2', 'disp', 'Agregar'));
  let kind = 'link';
  const kinds = el('div', 'chips');
  const fields = el('div', 'form2');
  const draw = () => {
    fields.replaceChildren();
    const f = (label, id, type, ph) => { const l = el('label', 'f'); const i = el('input'); i.id = id; i.type = type || 'text'; i.placeholder = ph || ''; i.autocomplete = 'off'; l.append(document.createTextNode(label), i); fields.append(l); return i; };
    if (kind === 'link') f('Link de la lista o stream', 'aUrl', 'url', 'https://…/lista.m3u');
    if (kind === 'xtream') { f('Servidor', 'aHost', 'url', 'http://servidor.com:8080'); f('Usuario', 'aUser'); f('Contraseña', 'aPass', 'password'); }
    if (kind === 'addon') f('Link del complemento (manifest.json)', 'aUrl', 'url', 'https://…/manifest.json');
    f('Nombre', 'aName', 'text', 'Ej. Mi servidor');
    const sub = btn('btn pri', 'Agregar y probar', addServer); fields.append(sub);
  };
  [['link', 'Lista M3U o stream'], ['xtream', 'Xtream'], ['addon', 'Complemento (Stremio)']].forEach(([k, n]) => kinds.append(btn('chip' + (k === kind ? ' on' : ''), n, (e) => { kind = k; kinds.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === e.currentTarget)); draw(); })));
  async function addServer() {
    const val = (id) => ($(id)?.value || '').trim();
    const name = val('aName');
    let s;
    if (kind === 'xtream') {
      const fromLink = xtreamFromUrl(val('aHost'));
      const host = fromLink ? fromLink.host : val('aHost'), user = val('aUser') || fromLink?.user, pass = $('aPass').value || fromLink?.pass;
      if (!/^https?:\/\//i.test(host) || !user || !pass) return toast('Completa servidor (con http:// o https://), usuario y contraseña.');
      s = {kind, host, user, pass, name: name || new URL(host).hostname};
    } else {
      const raw = val('aUrl'); if (!/^(https?|stremio):\/\//i.test(raw)) return toast('Pega un link que empiece con http:// o https://');
      const url = normalizeLink(raw);
      const k = /\/manifest\.json(\?|$)/i.test(url) ? 'addon' : 'link';
      s = {kind: k, url, name: name || (url.startsWith(IPTV) ? 'iptv-org' : new URL(url).hostname), autoName: !name};
    }
    s.id = newId(); S.servers.push(s); save(); built.vivo = false;
    toast('Probando “' + s.name + '”…');
    buildServers();
    const card = [...$('v-servidores').querySelectorAll('.scard')].pop();
    testServer(s, card.querySelector('.note'), card.querySelector('h4'));
  }
  draw();
  const pre = el('div', 'chips');
  COMPLEMENTOS.forEach(([n, u]) => { if (!S.servers.some((s) => s.url === u)) pre.append(btn('chip', '+ ' + n, () => { S.servers.push({id: newId(), kind: 'addon', name: n, url: u}); save(); buildServers(); })); });
  add.append(kinds, fields);
  if (pre.children.length) add.append(el('p', 'note', 'Complementos sugeridos:'), pre);
  add.append(el('p', 'note', 'Las listas gratuitas de iptv-org se eligen en En vivo → “Cambiar lista de iptv-org”.'));
  w.append(add);
  const sec = el('div', 'box'); sec.append(el('h2', 'disp', 'Protección'));
  sec.append(el('p', 'note', S.pin ? 'Con PIN, nadie puede ver ni cambiar tus servidores sin escribirlo. Los links nunca aparecen en pantalla.' : 'Los links nunca aparecen en pantalla. Pon un PIN en Ajustes para que nadie pueda cambiar ni borrar tus servidores.'));
  w.append(sec);
}
async function testServer(s, st, t) {
  st.textContent = 'Probando…'; t.querySelectorAll('.ok,.bad').forEach((x) => x.remove());
  try {
    if (s.kind === 'addon') { const m = await readManifest(s); if (m.name && s.autoName) { s.name = m.name; delete s.autoName; save(); t.firstChild.textContent = s.name; } AV = {}; saveAV(); ['inicio', 'peliculas', 'series', 'anime', 'buscar'].forEach((k) => built[k] = false); const r = (m.resources || []).map((x) => x.name || x); st.textContent = (m.name || s.name) + ' · ' + [r.includes('stream') && 'Videos', r.includes('subtitles') && 'Subtítulos', r.includes('catalog') && 'Catálogo'].filter(Boolean).join(' · '); }
    else { srcCache.delete(s.id); const r = await loadSource(s.id); st.textContent = r.channels.length + ' canales' + (r.hidden ? ' · ' + r.hidden + ' ocultos (solo apps)' : ''); }
    t.append(el('span', 'pill ok', 'Funciona'));
  } catch (e) {
    st.textContent = e.message === 'Failed to fetch' ? NO_CONN() : e.message;
    t.append(el('span', 'pill bad', 'Error'));
  }
}
function renameServer(s) {
  const i = el('input'); i.value = s.name; i.dataset.auto = '1';
  const ok = btn('btn pri', 'Guardar', () => { const n = i.value.trim(); if (n) { s.name = n; save(); built.vivo = false; } closePick(); buildServers(); });
  openPick('Renombrar', [i, ok]);
}
function configureAddon(s) {
  const base = addonBase(s);
  const i = el('input'); i.placeholder = 'Pega aquí el link nuevo (termina en manifest.json)'; i.dataset.auto = '1';
  const ok = btn('btn pri', 'Guardar', () => { const v = normalizeLink(i.value); if (!/\/manifest\.json(\?|$)/i.test(v)) return toast('El link debe terminar en manifest.json'); s.url = v; s.manifest = null; save(); closePick(); buildServers(); toast('Complemento actualizado'); });
  openPick('Configurar ' + s.name, [el('p', 'note', 'Desde tu celular o computadora abre esta dirección, elige tus opciones (por ejemplo, idiomas) y copia el link de instalación que te da:'), el('p', 'disp', base.replace(/^https?:\/\//, '') + '/configure'), i, ok]);
}

// =====================================================================
//  Ajustes
// =====================================================================
function buildSettings() {
  const v = $('v-ajustes'); v.replaceChildren();
  const h = el('div', 'head'); h.append(el('h1', 'disp', 'Ajustes')); v.append(h);
  if (S.pin && !unlocked) return lockScreen(v, 'Ajustes bloqueados');
  const w = el('div', 'wrap'); v.append(w);
  const chips = (opts, cur, set) => { const c = el('div', 'chips'); opts.forEach(([k, n]) => c.append(btn('chip' + (k === cur ? ' on' : ''), n, (e) => { set(k); c.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === e.currentTarget)); }))); return c; };
  const resetMeta = () => { cache.clear(); ['inicio', 'peliculas', 'series', 'anime', 'buscar'].forEach((k) => built[k] = false); loadTmdbGenres(); };
  // Idioma
  const b1 = el('div', 'box'); b1.append(el('h2', 'disp', 'Idioma de títulos y carátulas'),
    chips(IDIOMAS, S.lang, (k) => { S.lang = k; save(); resetMeta(); toast('Idioma cambiado'); }),
    el('p', 'note', useTmdb() ? 'Los títulos, sinopsis y carátulas se mostrarán en este idioma.' : 'Para ver títulos, sinopsis y carátulas en este idioma necesitas la clave de TMDB (abajo). Sin ella se usan los catálogos de Stremio, que vienen en inglés.'));
  w.append(b1);
  const b2 = el('div', 'box'); b2.append(el('h2', 'disp', 'Idioma de subtítulos'), chips(SUBS, S.subLang, (k) => { S.subLang = k; save(); toast('Guardado'); }),
    el('p', 'note', 'Se activan solos al ver una película o serie si tienes un complemento de subtítulos configurado.'));
  w.append(b2);
  // Solo disponibles
  const bA = el('div', 'box'); bA.append(el('h2', 'disp', 'Mostrar solo lo que se puede ver'),
    chips([['1', 'Sí, solo disponibles'], ['0', 'No, mostrar todo']], S.onlyAvail === false ? '0' : '1', (k) => { S.onlyAvail = k === '1'; save(); ['inicio', 'peliculas', 'series', 'anime', 'buscar'].forEach((x) => built[x] = false); toast('Guardado'); }),
    el('p', 'note', streamAddons().length ? 'La app pregunta a tus complementos de videos y oculta las películas y series que no tienen video. La revisión se recuerda 24 horas.' : 'Necesitas al menos un complemento con videos en Servidores para que esto funcione. Mientras no haya, se muestra todo.'),
    btn('btn sm', 'Volver a revisar todo ahora', () => { AV = {}; saveAV(); cache.clear(); ['inicio', 'peliculas', 'series', 'anime', 'buscar'].forEach((x) => built[x] = false); toast('Se revisará otra vez al abrir cada sección'); }));
  w.append(bA);
  // Intermediario
  const bP = el('div', 'box'); bP.append(el('h2', 'disp', 'Servidor intermedio'));
  bP.append(el('p', 'note', PROXY ? 'Estado: conectado ✓ — tus servidores, listas y videos se abren a través de él.' : 'Estado: no conectado. Sin él, muchos servidores Xtream, listas y videos no dejan abrirse desde el navegador.'),
    el('p', 'note', 'Lo mejor: en el navegador de la TV escribe la dirección que muestra la ventana de LZ-PLUS en tu computadora (por ejemplo http://192.168.1.10:8080). Así la app se abre desde ahí y se conecta sola, sin escribir nada aquí.'));
  const pi = el('input'); pi.placeholder = 'Dirección (si la app se abre desde otro lugar), ej. http://192.168.1.10:8080'; pi.value = S.proxy || '';
  const pb2 = el('div', 'btns');
  pb2.append(btn('btn pri', 'Conectar', async () => {
    let v = pi.value.trim(); if (v && !/^https?:\/\//i.test(v)) v = 'http://' + v; if (v && !/:\d+\/?$/.test(v)) v = v.replace(/\/+$/, '') + ':8080';
    S.proxy = v; save();
    if (await detectProxy()) { toast('Servidor intermedio conectado ✓'); return buildSettings(); }
    if (location.protocol === 'https:' && v.startsWith('http:')) return openPick('No se puede desde aquí', [el('p', 'note', 'Esta copia de la app está abierta desde una página segura (https) y el navegador no la deja hablar con tu computadora. Solución: en el navegador de la TV escribe directamente la dirección del servidor intermedio, por ejemplo ' + (v || 'http://192.168.1.10:8080') + '. La app se abre desde ahí y se conecta sola.')]);
    openPick('No se encontró', [el('p', 'note', 'La TV no llega a ' + (v || 'esa dirección') + '. Revisa:'),
      el('p', 'note', '1. Que la ventana de LZ-PLUS siga abierta en la computadora.'),
      el('p', 'note', '2. Que uses la dirección que dice “En el navegador de tu TV escribe” (empieza con 192.168…).'),
      el('p', 'note', '3. En Windows, haz doble clic en PERMITIR-EN-RED.bat y acepta. Es lo más común: el Firewall bloquea a la TV.'),
      el('p', 'note', '4. Que la TV y la computadora estén en el mismo Wi-Fi.'),
      el('p', 'note', 'Para probar, abre en la TV: ' + (v || 'http://IP:8080') + '/prueba')]);
  }));
  bP.append(pi, pb2); if (!NATIVE) w.append(bP);
  // TMDB
  const b3 = el('div', 'box'); b3.append(el('h2', 'disp', 'Carátulas en español (TMDB)'));
  b3.append(el('p', 'note', 'Gratis: crea una cuenta en themoviedb.org → Configuración → API, y copia la “Clave de la API (v3)”.'));
  const ki = el('input'); ki.type = 'password'; ki.placeholder = S.tmdb ? 'Clave guardada (escribe otra para cambiarla)' : 'Pega tu clave de TMDB'; ki.autocomplete = 'off';
  const kb = el('div', 'btns');
  kb.append(btn('btn pri', 'Guardar y probar', async () => {
    const k = ki.value.trim(); if (!k) return toast('Pega la clave primero');
    try { const r = await fetch(TMDB + '/configuration?api_key=' + encodeURIComponent(k)); if (!r.ok) throw 0; S.tmdb = k; save(); resetMeta(); ki.value = ''; toast('¡Listo! Carátulas en ' + IDIOMAS.find((x) => x[0] === S.lang)[1]); buildSettings(); }
    catch { toast('Esa clave no funcionó. Revísala.'); }
  }));
  if (S.tmdb) kb.append(btn('btn danger', 'Quitar clave', () => { S.tmdb = ''; save(); resetMeta(); toast('Clave quitada'); buildSettings(); }));
  b3.append(el('p', 'note', S.tmdb ? 'Estado: clave guardada ✓' : 'Estado: sin clave (catálogos de Stremio en inglés)'), ki, kb);
  w.append(b3);
  // PIN
  const b4 = el('div', 'box'); b4.append(el('h2', 'disp', 'PIN de protección'),
    el('p', 'note', 'Protege Servidores y Ajustes: sin el PIN nadie puede agregar, cambiar ni borrar servidores. Los links nunca se muestran en pantalla.'));
  const pb = el('div', 'btns');
  if (!S.pin) pb.append(btn('btn pri', 'Crear PIN', () => askPin('Crear PIN', (p) => { S.pin = p; unlocked = true; save(); toast('PIN creado'); buildSettings(); }, {create: true})));
  else pb.append(btn('btn', 'Cambiar PIN', () => askPin('PIN nuevo', (p) => { S.pin = p; save(); toast('PIN cambiado'); }, {create: true})), btn('btn danger', 'Quitar PIN', () => { S.pin = ''; save(); toast('PIN quitado'); buildSettings(); }), btn('btn', 'Bloquear ahora', () => { unlocked = false; go('inicio', true); toast('Bloqueado'); }));
  b4.append(pb); w.append(b4);
  // Restablecer
  const b5 = el('div', 'box'); b5.append(el('h2', 'disp', 'Restablecer'), el('p', 'note', 'Borra servidores, favoritos, clave y PIN de este aparato.'));
  b5.append(btn('btn danger', 'Borrar todo', () => confirmBox('¿Borrar todo?', 'No se puede deshacer.', 'Borrar todo', () => { localStorage.removeItem(KEY); location.reload(); })));
  w.append(b5);
}

// =====================================================================
//  Arranque
// =====================================================================
load();
clock(); setInterval(clock, 15000);
Promise.allSettled([detectProxy(), loadTmdbGenres()]).then(async () => { await Promise.race([refreshAddons(), sleep(2500)]); built.inicio = true; buildHome(); });
setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) focusEl(document.querySelector('#v-inicio .card:not(.sk)') || document.querySelector('.nav.on')); }, 2500);
</script>
</body>
</html>
