plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lzplus.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lzplus.tv'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Llave fija (guardada como secreto en GitHub): las actualizaciones se instalan encima sin borrar tu configuración
    def lzKey = rootProject.file('lz-plus.p12')
    signingConfigs {
        lz {
            if (lzKey.exists()) {
                storeFile lzKey
                storePassword System.getenv('LZ_KEY_PASS') ?: ''
                keyAlias 'lzplus'
                keyPassword System.getenv('LZ_KEY_PASS') ?: ''
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug { if (lzKey.exists()) signingConfig signingConfigs.lz }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'
    // Decodificador propio de audio Dolby (AC3/E-AC3), DTS y TrueHD para aparatos que no lo traen
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'
}
